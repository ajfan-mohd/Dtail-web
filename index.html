<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTAIL Agency - Modern Portfolio</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#29FD30',
                        dark: '#0a0a0a',
                    },
                    fontFamily: {
                        sans: ['Nakheel Text', 'sans-serif'],
                        display: ['Nakheel Headline', 'Nakheel Text', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'marquee': 'marquee 40s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Nakheel Fonts -->
    <style>
        @font-face {
            font-family: 'Nakheel Text';
            src: url('/assets/Fonts/Nakheel-TextRegular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Nakheel Text';
            src: url('/assets/Fonts/Nakheel-TextBold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Nakheel Headline';
            src: url('/assets/Fonts/Nakheel-HeadlineRegular.otf') format('opentype');
            font-weight: bolder;
            font-style: bold;
            font-display: swap;
        }

        body {
            font-family: 'Nakheel Text', sans-serif;
            background-color: #0a0a0a;
            color: #ededed;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-display {
            font-family: 'Nakheel Headline', 'Nakheel Text', sans-serif;
            letter-spacing: 0.05em;
        }

        .text-stroke {
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.2);
            color: transparent;
        }

        .text-stroke-hover:hover {
            -webkit-text-stroke: 0px;
            color: #29FD30;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fat-border-bottom {
            border-bottom-width: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>



</head>

<body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
